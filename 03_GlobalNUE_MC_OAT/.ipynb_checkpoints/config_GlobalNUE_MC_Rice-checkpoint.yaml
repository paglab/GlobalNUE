# Crop-specific values (SN, BNF, Nup equation incl. floor/manure flag, sources,
# paths, group weights) are copied from the uploaded rice M2 YAML.
# Relative input uncertainty ±15% (uniform) is an INITIAL ASSUMPTION,
# not an empirical confidence interval. Revise per product as evidence allows.
# Source-mixture NUE distribution is NOT the uncertainty of the M2 weighted-median estimator.
# All results go to a separate MC output_dir; baseline M2 outputs are not overwritten.
# Parallel scratch_dir: for a fast local SSD, enter an existing directory.
# The config uses 5000 runs and 16 Windows-safe worker processes by default.
# Disable parallel or reduce n_simulations for a preliminary test if needed.

