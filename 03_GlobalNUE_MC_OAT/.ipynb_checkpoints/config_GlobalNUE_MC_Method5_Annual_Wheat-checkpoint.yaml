# Wheat MC Global Method 5: annual Excel summary + 8 annual GeoTIFFs only.
# No per-realization rows, CSV files, or PNG/PDF/SVG plots are generated.
# Global baseline uses processed NUE + Nup + harvested-area rasters.
# Edit input paths in global_aggregation before running.
scientific_settings_confirmed: true
years:
- 1995
- 2020
output_dir: Z:/staff/Qiang_S/09_Datasets/03GlobalNUE_Results/01Global_NUE_Wheat/05WheatNUE_MC_v1031
block_height: 64
block_width: 64
out_nodata: -9999.0
output_decimals: 6
SN: 3.5
BNF: 5.0
nup_equation:
  yield_coefficient: 0.02021937
  fertilizer_manure_coefficient: 0.09269749
  intercept: -5.5811
  min_nup: 4.5
  include_manure: true
sources:
  yield:
  - id: GAEZ
    directory: Z:/staff/Qiang_S/09_Datasets/02N_Output/01Global_Yield_Wheat/02StandardizedDatasets/GAEZ_Wheat
    group: Y_GAEZ
    group_weight: 0.23
    within_group_weight: 1.0
    mc_relative_lower: -0.15
    mc_relative_upper: 0.15
  - id: GDHY
    directory: Z:/staff/Qiang_S/09_Datasets/02N_Output/01Global_Yield_Wheat/02StandardizedDatasets/GDHY_wheat_5min
    group: Y_GDHY
    group_weight: 0.23
    within_group_weight: 1.0
    mc_relative_lower: -0.15
    mc_relative_upper: 0.15
  - id: GlobalCropYield5min
    directory: Z:/staff/Qiang_S/09_Datasets/02N_Output/01Global_Yield_Wheat/02StandardizedDatasets/GlobalCropYield5min_Yield
    group: Y_GCY
    group_weight: 0.3
    within_group_weight: 0.6
    mc_relative_lower: -0.15
    mc_relative_upper: 0.15
  - id: GlobalWheatYield4km
    directory: Z:/staff/Qiang_S/09_Datasets/02N_Output/01Global_Yield_Wheat/02StandardizedDatasets/GlobalWheatYield4km_ReProj5min_Mean
