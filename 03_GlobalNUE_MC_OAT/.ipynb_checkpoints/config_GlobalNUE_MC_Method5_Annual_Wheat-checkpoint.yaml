crop: wheat
require_equal_yield_grids: true
constant_uncertainty:
  SN:
    mc_relative_lower: -0.15
    mc_relative_upper: 0.15
  BNF:
    mc_relative_lower: -0.15
    mc_relative_upper: 0.15
monte_carlo:
  scheme: source_mixture_independent
  distribution: uniform_relative
  n_simulations: 5000
  batch_size: 64
  random_seed: 42
parallel:
  enabled: true
  max_workers: 16
  max_pending_tasks: 24
  scratch_dir: null
global_aggregation:
  method: nup_ratio_of_sums
  area_threshold: 0.0
  nue_min_value: 0.0
  nup_min_value: 0.0
  additional_nodata:
  - -9999.0
  restrict_to_baseline_valid: true
  reference_nue_mask:
    directory: Z:/staff/Qiang_S/09_Datasets/03GlobalNUE_Results/01Global_NUE_Wheat/02WheatNUE_M2_20261030V1_M6_150R
    filename_template: NUE_median_Opt_{year}.tif
  harvested_area:
    directory: Z:/staff/Qiang_S/09_Datasets/09OtherDataUsed/GCSN_HarvestedArea_1995_2020/02StandardizedDatasets/01WheatHarvestedArea
    filename_template: Wheat_HarArea_{year}.tif
  baseline_nup:
    directory: Z:/staff/Qiang_S/09_Datasets/03GlobalNUE_Results/01Global_NUE_Wheat/02WheatNUE_M2_20261030V1
    filename_template: Nup_M2_median_{year}.tif
