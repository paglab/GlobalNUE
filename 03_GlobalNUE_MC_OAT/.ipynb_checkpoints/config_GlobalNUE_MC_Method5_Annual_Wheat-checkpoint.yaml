    group: F_A
    group_weight: 0.35
    within_group_weight: 0.6
    mc_relative_lower: -0.15
    mc_relative_upper: 0.15
  - id: HaNi_F
    directory: Z:/staff/Qiang_S/09_Datasets/01N_Input/01Global_SyntheticFertilizer/02StandardizedDatasets/01HaNi_Fer_Wheat_Standardized
    group: F_A
    group_weight: 0.35
    within_group_weight: 0.4
    mc_relative_lower: -0.15
    mc_relative_upper: 0.15
  - id: LUH2v2_F
    directory: Z:/staff/Qiang_S/09_Datasets/01N_Input/01Global_SyntheticFertilizer/02StandardizedDatasets/01LUH2v2_Fer_Wheat_Standardized
    group: F_B
    group_weight: 0.3
    within_group_weight: 1.0
    mc_relative_lower: -0.15
    mc_relative_upper: 0.15
