# Global Wheat / Maize / Rice M2 Independent MC configuration (WHEAT example)
# To run maize or rice: copy this YAML, replace crop, SN, BNF, nup_equation,
# source folders/IDs/weights, years, output_dir, and perturbation bounds.
# Derived from uploaded Wheat M2 baseline YAML (2026-10-30), not old 99ForTest paths.
# NOTE: M2 source-mixture predictive distribution, not the CI for weighted-median estimator.
# ALL MC errors are assumed independent, uniformly distributed relative multipliers.
# SN and BNF are randomly perturbed; manure ALWAYS remains in NUE denominator.
# Baseline points_xlsx/tmp_dir/delete_tmp do not control this MC script and are omitted.
# All annual maps have independent output folders per crop.

# Been Checked

scientific_settings_confirmed: true
years:
- 1995
- 2020
output_dir: Z:/staff/Qiang_S/09_Datasets/03GlobalNUE_Results/01Global_NUE_Wheat/03WheatNUE_M2_Independent_MC_V1031
block_height: 64
block_width: 64
out_nodata: -9999.0
output_decimals: 6
SN: 3.5
BNF: 5.0
nup_equation:
  yield_coefficient: 0.02021937
  fertilizer_manure_coefficient: 0.09269749
  intercept: -5.5811
  min_nup: 4.5
  include_manure: true

