crop: wheat

require_equal_yield_grids: true

constant_uncertainty:
  SN:
    mc_relative_lower: -0.30
    mc_relative_upper: 0.30
  BNF:
    mc_relative_lower: -0.15
    mc_relative_upper: 0.15

monte_carlo:
  scheme: source_mixture_independent
  distribution: uniform_relative
  n_simulations: 5000
  batch_size: 64
  random_seed: 42
parallel:
  enabled: true
  max_workers: 16
  max_pending_tasks: 24
  scratch_dir: null