    directory: Z:\staff\Qiang_S\09_Datasets\02N_Output\02Global_Yield_Maize\02StandardizedDatasets\MaizeYield_GAEZ5min
    group: Y_GAEZ
    group_weight: 0.25
    within_group_weight: 1.0
  - id: GDHY
    directory: Z:\staff\Qiang_S\09_Datasets\02N_Output\02Global_Yield_Maize\02StandardizedDatasets\MaizeYield_GDHY5min
    group: Y_GDHY
    group_weight: 0.25
    within_group_weight: 1.0
  - id: GlobalCropYield5min
    directory: Z:\staff\Qiang_S\09_Datasets\02N_Output\02Global_Yield_Maize\02StandardizedDatasets\MaizeYield_GlobalCropYield5min
    group: Y_GCY
    group_weight: 0.25
    within_group_weight: 1.0
  - id: SPAM
    directory: Z:\staff\Qiang_S\09_Datasets\02N_Output\02Global_Yield_Maize\02StandardizedDatasets\MaizeYield_SPAM5min
    group: Y_SPAM
    group_weight: 0.25
    within_group_weight: 1.0
  F:
  - id: GCSN_F
    directory: Z:\staff\Qiang_S\09_Datasets\01N_Input\01Global_SyntheticFertilizer\02StandardizedDatasets\02GCSN_Fer_Maize_Standardized
    group: F_A
    group_weight: 0.35
    within_group_weight: 0.6
  - id: HaNi_F
    directory: Z:\staff\Qiang_S\09_Datasets\01N_Input\01Global_SyntheticFertilizer\02StandardizedDatasets\02HaNi_Fer_Maize_Standardized
    group: F_A
    group_weight: 0.35
    within_group_weight: 0.4
  - id: LUH2v2_F
    directory: Z:\staff\Qiang_S\09_Datasets\01N_Input\01Global_SyntheticFertilizer\02StandardizedDatasets\02LUH2v2_Fer_Maize_Standardized
    group: F_B
    group_weight: 0.3
    within_group_weight: 1.0
  - id: NPKGRIDS_F
    directory: Z:\staff\Qiang_S\09_Datasets\01N_Input\01Global_SyntheticFertilizer\02StandardizedDatasets\02NPKGRIDS_Fer_Maize_Standardized
    group: F_C
    group_weight: 0.35
    within_group_weight: 1.0
  M:
  - id: GCSN_M
    directory: Z:\staff\Qiang_S\09_Datasets\01N_Input\02Global_Manure\02StandardizedDatasets\02GCSN_Man_Maize_Standardized
    group: M_GCSN
    group_weight: 0.5
    within_group_weight: 1.0
  - id: HaNi_M
    directory: Z:\staff\Qiang_S\09_Datasets\01N_Input\02Global_Manure\02StandardizedDatasets\02HaNi_Man_Maize_Standardized
    group: M_HaNi
    group_weight: 0.5
    within_group_weight: 1.0
