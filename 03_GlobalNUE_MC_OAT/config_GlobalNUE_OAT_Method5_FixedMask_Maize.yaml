  - yield
  - F
  - M
  - D
  - SN
  - BNF
  relative_change: 0.15
aggregation:
  mode: nup_ratio_of_sums
  area_threshold: 0.0
  nue_min_value: 0.0
  nup_min_value: 0.0
  additional_nodata:
  - -9999.0
  use_written_raster_precision: true
  harvested_area:
