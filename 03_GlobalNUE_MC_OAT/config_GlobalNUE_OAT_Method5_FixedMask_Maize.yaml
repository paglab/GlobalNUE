# Method 5 OAT using year-specific processed NUE mask as STRICT spatial domain.
# Mask values are NOT used, only valid finite non-NoData pixels.
# If a reference mask file is missing or its grid differs, the run stops.
# Maize/Rice: set reference_nue_mask.directory to the corresponding processed NUE folder.
scientific_settings_confirmed: true
crop: maize
years:
- 1995
- 2020
output_dir: Z:/staff/Qiang_S/09_Datasets/03GlobalNUE_Results/02Global_NUE_Maize/04MaizeNUE_M2_OAT_FixedMaskV1031
block_height: 64
block_width: 64
parallel:
  enabled: true
  max_workers: 4
out_nodata: -9999.0
output_decimals: 6
SN: 0.4
BNF: 5.0
nup_equation:
  yield_coefficient: 0.0123938
  fertilizer_manure_coefficient: 0.03345389
  intercept: 5.38694
  min_nup: 11.5
  include_manure: true
sources:
  yield:
